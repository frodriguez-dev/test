# Root pytest entry point for the repository-level Python tooling.
#
# The backend keeps its own configuration in backend/pyproject.toml, so running
# pytest from backend/ is unaffected. This file makes the documented
# `uv run --project tools/agent_pipeline pytest` command collect only the
# tooling tests instead of walking the whole monorepo.
[pytest]
testpaths = tools/agent_pipeline/tests
